name: Bot
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl https://openrouter.ai/api/v1/chat/completions -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" -d '{"model": "qwen/qwen-2.5-7b-instruct:free", "messages": [{"role": "user", "content": "请回复：主人你好，我已经成功接入你的免费大脑了！"}]}'
