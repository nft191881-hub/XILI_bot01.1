name: My Free Bot

on:
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Call DeepSeek API
        run: |
          echo "正在唤醒机器人..."
          curl https://api.deepseek.com/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.DEEPSEEK_API_KEY }}" \
            -d '{
                  "model": "deepseek-chat",
                  "messages": [
                    {"role": "system", "content": "你是一个测试成功的机器人。"},
                    {"role": "user", "content": "请回复：主人你好，我已经成功接入你的免费大脑了！"}
                  ],
                  "stream": false
                }'
